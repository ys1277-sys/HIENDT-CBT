<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 280" width="430" height="280"
     font-family="serif" font-size="17">
  <rect width="430" height="280" fill="#ffffff"/>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 용접부 경계 -->
  <line x1="35" y1="48" x2="380" y2="48" stroke="#000" stroke-width="1.6"/>
  <line x1="35" y1="160" x2="380" y2="160" stroke="#000" stroke-width="1.6"/>

  <!-- 지시 A -->
  <ellipse cx="200" cy="105" rx="42" ry="27" fill="none" stroke="#000" stroke-width="1.6"/>
  <text x="212" y="112" text-anchor="middle">A</text>

  <!-- 세로 치수 보조선 -->
  <line x1="200" y1="78" x2="285" y2="78" stroke="#000" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="200" y1="132" x2="285" y2="132" stroke="#000" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="277" y1="78" x2="277" y2="132" stroke="#000" stroke-width="1.4"
        marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="295" y="111">2/16&#8243;</text>

  <!-- 가로 치수 보조선 -->
  <line x1="158" y1="105" x2="158" y2="215" stroke="#000" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="242" y1="105" x2="242" y2="215" stroke="#000" stroke-width="0.9" stroke-dasharray="3 3"/>
  <line x1="158" y1="205" x2="242" y2="205" stroke="#000" stroke-width="1.4"
        marker-start="url(#d)" marker-end="url(#d)"/>
  <text x="200" y="240" text-anchor="middle">4/16&#8243;</text>
</svg>
